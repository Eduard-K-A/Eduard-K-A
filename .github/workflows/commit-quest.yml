name: Update Commit Quest Arcade

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-arcade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test generator
        run: node --test scripts/generate-commit-quest.test.mjs

      - name: Generate Commit Quest Arcade
        run: node scripts/generate-commit-quest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated arcade card
        run: |
          if git diff --quiet -- assets/commit-quest.svg; then
            echo "Commit Quest Arcade is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-quest.svg
          git commit -m "chore: update Commit Quest Arcade"
          git push
